# Optional local TLS endpoint. See docs/local-docker.md for certificate setup.
services:
  frontend:
    build:
      args:
        VITE_API_BASE_URL: /
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/frontend.local-https.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.env.docker-tls:/etc/nginx/local-tls:ro
